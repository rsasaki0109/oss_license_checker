[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-license-checker"
version = "0.6.0"
description = "Inspect installed Python dependency licenses and enforce CI policies"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["packaging>=24.2"]

[project.optional-dependencies]
test = ["jsonschema>=4.18"]

[project.urls]
Repository = "https://github.com/rsasaki0109/oss_license_checker"
Documentation = "https://github.com/rsasaki0109/oss_license_checker#readme"
Issues = "https://github.com/rsasaki0109/oss_license_checker/issues"

[project.scripts]
oss-license-checker = "oss_license_checker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
