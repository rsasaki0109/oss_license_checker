[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-license-checker"
version = "0.3.0"
description = "Inspect installed Python dependency licenses and enforce CI policies"
requires-python = ">=3.11"
dependencies = ["packaging>=23.2"]

[project.scripts]
oss-license-checker = "oss_license_checker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
