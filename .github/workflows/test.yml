name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
        packaging: ['latest']
        include:
          - python: '3.11'
            packaging: '24.2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - name: Install minimum supported packaging
        if: matrix.packaging != 'latest'
        run: python -m pip install packaging==${{ matrix.packaging }}
      - run: python -m unittest discover -s tests -v
      - name: Test composite action
        uses: ./
        with:
          packages: packaging
          fail-unknown: 'true'
          fail-missing-license-files: 'true'
          upload-artifact: 'false'
      - name: Generate license report
        run: oss-license-checker oss-license-checker --recursive --format html --output licenses.html --license-bundle licenses.zip
      - name: Generate Markdown report
        if: ${{ !cancelled() }}
        run: oss-license-checker oss-license-checker --recursive --format markdown --output licenses.md
      - name: Publish job summary
        if: ${{ !cancelled() }}
        run: |
          if [ -f licenses.md ]; then
            cat licenses.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: license-report-python-${{ matrix.python }}-packaging-${{ matrix.packaging }}
          path: |
            licenses.html
            licenses.zip
            licenses.md
