name: real projects
on: [push, pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [requests, httpx, rich]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build
      - run: python -m build
      - name: Install locked dependencies and built wheel in a clean environment
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          python -m venv "$RUNNER_TEMP/project-env"
          "$RUNNER_TEMP/project-env/bin/python" -m pip install -r "examples/validation/$PROJECT/requirements.txt" dist/*.whl
      - name: Validate installed project
        env:
          PROJECT: ${{ matrix.project }}
        run: python scripts/validate_real_project.py --python "$RUNNER_TEMP/project-env/bin/python" --project "$PROJECT" --output validation-results
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: validation-${{ matrix.project }}
          path: validation-results
